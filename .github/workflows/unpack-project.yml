name: Unpack project

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack project ZIP into repository root
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "${ZIP}" ]; then
            echo "No ZIP file found in repository root."
            exit 1
          fi

          rm -rf .unpacked
          mkdir .unpacked
          unzip -q "$ZIP" -d .unpacked

          INDEX_FILE="$(find .unpacked -type f -name 'index.html' -print -quit)"
          if [ -z "${INDEX_FILE}" ]; then
            echo "Could not find index.html in extracted archive."
            exit 1
          fi

          ROOT_DIR="$(dirname "$INDEX_FILE")"
          cp -a "$ROOT_DIR"/. ./
          rm -rf .unpacked

          # This workflow is only needed once.
          rm -f .github/workflows/unpack-project.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Unpack True Print Shop project"
          git push origin HEAD:main
