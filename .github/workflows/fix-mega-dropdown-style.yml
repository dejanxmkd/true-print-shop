name: Fix mega dropdown style
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append canonical mega dropdown overrides
        run: echo '' | base64 -d >> design-system.css
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design-system.css
          git commit -m "Match Custom Apparel dropdown to navigation style" || exit 0
          git push
