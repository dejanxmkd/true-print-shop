name: Global dark title tags

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply dark title tags across all pages
        env:
          CSS_PATCH_B64: 
          README_PATCH_B64: 
        run: |
          set -euo pipefail
          if ! grep -q "Global dark title-tag rule" design-system.css; then
            printf '%s' "$CSS_PATCH_B64" | base64 -d >> design-system.css
          fi
          if ! grep -q "Dark title tags on colored/image sections" README.md; then
            printf '%s' "$README_PATCH_B64" | base64 -d >> README.md
          fi
          rm -f .github/workflows/global-dark-tags.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Standardize dark title tags across all pages"
          git push origin HEAD:main
