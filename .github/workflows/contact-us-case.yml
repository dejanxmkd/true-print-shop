name: Normalize Contact us navigation label
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update navigation labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['index.html','collection.html','product.html','info.html']:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text()
              s = s.replace('href="info.html?page=contact">Contact Us</a>', 'href="info.html?page=contact">Contact us</a>')
              s = s.replace('href="info.html?page=contact">Contact Us<i', 'href="info.html?page=contact">Contact us<i')
              p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html collection.html product.html info.html
          git commit -m "Use Contact us casing in navigation" || exit 0
          git push
