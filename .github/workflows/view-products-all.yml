name: Link View products to all products
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update hero View products link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<a class="button primary" href="#categories">View products</a>'
          new = '<a class="button primary" href="collection.html?category=all">View products</a>'
          if old not in s:
              raise SystemExit('Expected View products link not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/view-products-all.yml
          git add index.html
          git commit -m "Link View products to all products"
          git push
