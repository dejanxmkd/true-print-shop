name: Fix hero canonical button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize hero Start your design button
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q "Hero canonical white button" design-system.css; then
            cat >> design-system.css <<'CSS'

/* Hero canonical white button — same Shop Bundles geometry and interaction. */
.hero .button.light,
.hero .button.light:hover,
.hero .button.light:focus-visible,
.hero .button.light:active {
  min-height: var(--control-height) !important;
  padding: 0 22px !important;
  border: 2px solid var(--color-ink) !important;
  border-radius: var(--radius-control) !important;
  background: var(--color-cream) !important;
  color: var(--color-ink) !important;
}

.hero .button.light {
  box-shadow: none !important;
  transform: none !important;
}

.hero .button.light:hover,
.hero .button.light:focus-visible {
  box-shadow: 4px 4px 0 var(--color-ink) !important;
  transform: translate(-2px,-2px) !important;
}

.hero .button.light:active {
  box-shadow: 1px 1px 0 var(--color-ink) !important;
  transform: translate(1px,1px) !important;
}
CSS
          fi

          rm -f .github/workflows/fix-hero-button.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Normalize hero Start your design button"
          git push origin HEAD:main
