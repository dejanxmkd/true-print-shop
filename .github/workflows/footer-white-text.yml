name: Footer white text

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force all footer text to white
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q "Global footer white text" styles.css; then
            cat >> styles.css <<'CSS'

/* Global footer white text */
.site-footer,
.site-footer h1,
.site-footer h2,
.site-footer h3,
.site-footer h4,
.site-footer h5,
.site-footer h6,
.site-footer p,
.site-footer a,
.site-footer span,
.site-footer strong,
.site-footer small,
.site-footer li,
.site-footer i {
  color: var(--cream) !important;
}
CSS
          fi

          rm -f .github/workflows/footer-white-text.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make footer text white everywhere"
          git push origin HEAD:main
