name: Normalize cart remove button

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply canonical cart remove interaction
        run: |
          if ! grep -q "Canonical cart remove control" design-system.css; then
            cat >> design-system.css <<'EOF'

/* Canonical cart remove control — same interaction language as the shared buttons. */
.cart-remove {
  border: 2px solid var(--color-ink) !important;
  background: var(--color-cream) !important;
  color: var(--color-ink) !important;
  box-shadow: none !important;
  transform: none !important;
  transition: transform var(--motion-fast), background-color var(--motion-fast), color var(--motion-fast), box-shadow var(--motion-fast) !important;
}

.cart-remove:hover,
.cart-remove:focus-visible {
  background: var(--color-cream) !important;
  color: var(--color-ink) !important;
  box-shadow: 4px 4px 0 var(--color-ink) !important;
  transform: translate(-2px,-2px) !important;
}

.cart-remove:active {
  background: var(--color-cream) !important;
  color: var(--color-ink) !important;
  box-shadow: 1px 1px 0 var(--color-ink) !important;
  transform: translate(1px,1px) !important;
}
EOF
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design-system.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Normalize cart remove button behavior"
          git push
