name: Remove homepage marquee
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove marquee block
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          start = s.find('    <div class="marquee" aria-label="True Print Shop benefits">')
          if start == -1:
              raise SystemExit('Marquee block not found')
          end_marker = '</div></div></div>\n  </main>'
          end = s.find(end_marker, start)
          if end == -1:
              raise SystemExit('Marquee block end not found')
          end += len('</div></div></div>\n')
          s = s[:start] + s[end:]
          p.write_text(s)
          PY
      - name: Commit change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-home-marquee.yml
          git add index.html
          git commit -m "Remove homepage marquee"
          git push
