name: Refine filter headings

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update filter heading styles
        run: |
          cat >> collection.css <<'CSS'

/* Filter modal heading refinement */
.filter-scroll > h2,
.catalog-filters h2 {
  font-size: 22px;
  font-weight: 800;
}
.filter-scroll > h2::after {
  display: none;
  content: none;
}
CSS
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refine-filter-headings.yml
          git add collection.css
          git commit -m "Refine filter modal headings"
          git push
