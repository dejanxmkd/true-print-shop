name: Normalize title tags

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add global dark tag styling for colored and image sections
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q "Global title-tag contrast rule" styles.css; then
            cat >> styles.css <<'CSS'

/* Global title-tag contrast rule: on dark, blue, or image-led sections, title tags are always black with white text. */
:is(.hero,.embroidery,.custom,.catalog-hero,.brand-photo,[class*="hero"],[class*="banner"],[class*="masthead"]):is(.hero,.embroidery,.custom,.catalog-hero,.brand-photo,[class*="hero"],[class*="banner"],[class*="masthead"]) .eyebrow,
:is(.hero,.embroidery,.custom,.catalog-hero,.brand-photo,[class*="hero"],[class*="banner"],[class*="masthead"]) .section-tag,
:is(.hero,.embroidery,.custom,.catalog-hero,.brand-photo,[class*="hero"],[class*="banner"],[class*="masthead"]) .kicker {
  background: var(--ink) !important;
  color: var(--cream) !important;
  border-color: var(--ink) !important;
}

/* Explicit home-page colored/image sections. */
.hero .eyebrow,
.embroidery .eyebrow,
.custom .eyebrow,
.catalog-hero .eyebrow {
  background: var(--ink) !important;
  color: var(--cream) !important;
  border-color: var(--ink) !important;
}
CSS
          fi

          rm -f .github/workflows/normalize-title-tags.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Standardize title tags on colored sections"
          git push origin HEAD:main
