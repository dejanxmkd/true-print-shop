name: Fix embroidery section link

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-embroidery-link.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Limit embroidery link to button
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<a class="embroidery reveal" href="collection.html?category=t-shirts"><div class="placeholder" role="img" aria-label="Embroidery image placeholder"></div><div class="embroidery-card"><p class="eyebrow">True Print Shop</p><h2><span>Precision in</span><span>Every Stitch</span></h2><p>Durable threads, careful digitising and precise in-house finishing make every piece look sharper and last longer.</p><span class="button light">Explore custom embroidery<i class="material-icons">arrow_forward</i></span></div></a>'
          new = '<section class="embroidery reveal"><div class="placeholder" role="img" aria-label="Embroidery image placeholder"></div><div class="embroidery-card"><p class="eyebrow">True Print Shop</p><h2><span>Precision in</span><span>Every Stitch</span></h2><p>Durable threads, careful digitising and precise in-house finishing make every piece look sharper and last longer.</p><a class="button light" href="collection.html?category=t-shirts">Explore custom embroidery<i class="material-icons">arrow_forward</i></a></div></section>'
          if old not in s:
              raise SystemExit('Embroidery block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/fix-embroidery-link.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Limit embroidery link to CTA button"
          git push
