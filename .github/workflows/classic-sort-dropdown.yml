name: Classic sort dropdown
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append classic sort menu overrides
        run: |
          cat >> collection.css <<'EOF'

/* Classic collection sort dropdown: one clean menu, no boxed option cards. */
.sort-menu{
  padding:6px 0!important;
  border:2px solid var(--ink)!important;
  border-radius:14px!important;
  background:var(--cream)!important;
  box-shadow:4px 4px 0 var(--ink)!important;
  overflow:hidden;
}
.sort-menu button{
  min-height:44px!important;
  padding:10px 16px!important;
  border:0!important;
  border-radius:0!important;
  background:transparent!important;
  color:var(--ink)!important;
  box-shadow:none!important;
  transform:none!important;
  text-align:left;
  font-weight:700;
}
.sort-menu button:hover,
.sort-menu button:focus-visible,
.sort-menu button.active{
  background:var(--blue)!important;
  color:var(--cream)!important;
  box-shadow:none!important;
  transform:none!important;
}
EOF
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collection.css
          git commit -m "Make collection sort dropdown classic" || exit 0
          git push
