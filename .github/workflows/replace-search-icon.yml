name: Replace search icon
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace manage_search with search
        run: |
          sed -i 's/>manage_search</>search</g' index.html collection.html product.html info.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html collection.html product.html info.html
          git commit -m "Use standard search icon across navigation" || exit 0
          git push
      - name: Remove one-time workflow
        run: |
          git pull --rebase
          git rm .github/workflows/replace-search-icon.yml
          git commit -m "Remove search icon workflow"
          git push
