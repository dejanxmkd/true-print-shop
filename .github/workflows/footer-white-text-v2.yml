name: Apply footer white text

on: [push]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update footer colors
        run: |
          printf '\n/* Global footer white text */\n.site-footer, .site-footer h1, .site-footer h2, .site-footer h3, .site-footer h4, .site-footer h5, .site-footer h6, .site-footer p, .site-footer a, .site-footer span, .site-footer strong, .site-footer small, .site-footer li, .site-footer i { color: var(--cream) !important; }\n' >> styles.css
          rm -f .github/workflows/footer-white-text.yml .github/workflows/footer-white-text-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make footer text white everywhere"
          git push
