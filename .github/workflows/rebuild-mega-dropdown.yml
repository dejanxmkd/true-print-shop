name: Rebuild mega dropdown
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild mega dropdown CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('design-system.css')
          css = p.read_text()
          marker = r'/\* Canonical desktop dropdowns: Custom Apparel matches the standard dropdown language\. \*/\n@media \(min-width: 1481px\) \{.*?\n\}'
          css = re.sub(marker, '', css, flags=re.S)
          css = css.rstrip() + '''\n\n/* Custom Apparel mega dropdown — compact, anchored, and visually matched to standard dropdowns. */\n@media (min-width: 1481px) {\n  .desktop-nav .nav-item.has-mega-dropdown {\n    position: relative !important;\n  }\n\n  .desktop-nav .nav-item.has-mega-dropdown > .mega-menu {\n    position: absolute !important;\n    top: calc(100% + 10px) !important;\n    left: 0 !important;\n    right: auto !important;\n    width: min(760px, calc(100vw - 80px)) !important;\n    max-height: none !important;\n    padding: 20px 22px !important;\n    display: grid !important;\n    grid-template-columns: repeat(3, minmax(150px, 1fr)) !important;\n    gap: 18px 28px !important;\n    background: var(--color-cream) !important;\n    color: var(--color-ink) !important;\n    border: 2px solid var(--color-ink) !important;\n    border-radius: 18px !important;\n    box-shadow: 6px 6px 0 var(--color-ink) !important;\n    opacity: 0 !important;\n    visibility: hidden !important;\n    pointer-events: none !important;\n    transform: translateY(6px) !important;\n    transition: opacity var(--motion-fast), transform var(--motion-fast), visibility var(--motion-fast) !important;\n    z-index: 60 !important;\n  }\n\n  .desktop-nav .nav-item.has-mega-dropdown:hover > .mega-menu,\n  .desktop-nav .nav-item.has-mega-dropdown:focus-within > .mega-menu {\n    opacity: 1 !important;\n    visibility: visible !important;\n    pointer-events: auto !important;\n    transform: translateY(0) !important;\n  }\n\n  .desktop-nav .mega-column {\n    display: flex !important;\n    flex-direction: column !important;\n    gap: 7px !important;\n    min-width: 0 !important;\n  }\n\n  .desktop-nav .mega-column h3 {\n    margin: 0 0 4px !important;\n    padding: 0 !important;\n    font-size: 16px !important;\n    line-height: 1.25 !important;\n    font-weight: 800 !important;\n    color: var(--color-blue) !important;\n  }\n\n  .desktop-nav .mega-column a {\n    display: block !important;\n    padding: 2px 0 !important;\n    font-size: 16px !important;\n    line-height: 1.35 !important;\n    font-weight: 700 !important;\n    color: var(--color-ink) !important;\n    white-space: normal !important;\n    transform: none !important;\n  }\n\n  .desktop-nav .mega-column a:hover {\n    color: var(--color-blue) !important;\n    transform: none !important;\n  }\n}\n'''
          p.write_text(css)
          PY
      - name: Commit mega dropdown rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design-system.css
          git commit -m "Rebuild Custom Apparel mega dropdown" || exit 0
          git push
      - name: Remove one-time workflow
        run: |
          git pull --rebase
          git rm .github/workflows/rebuild-mega-dropdown.yml
          git commit -m "Remove mega dropdown rebuild workflow"
          git push